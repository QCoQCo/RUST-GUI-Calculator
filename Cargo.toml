[package]
name = "gui_calculator"
version = "0.1.0"
edition = "2021"

[dependencies]
# GPU 렌더러(wgpu)를 빼고 CPU 렌더러(tiny-skia)만 사용
iced = { version = "0.14", default-features = false, features = [
    "tiny-skia",
    "crisp",
    "web-colors",
    "thread-pool",
    "linux-theme-detection",
    "x11",
    "wayland",
] }
num-bigint = "0.4"
num-rational = "0.4.2"
num-traits = "0.2.19"
